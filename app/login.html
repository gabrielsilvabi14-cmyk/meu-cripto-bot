<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · GMGN Trader</title><style>body{background:#0b1120;color:#eef2ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center;margin:0}main{background:#172238;border:1px solid #334155;border-radius:18px;padding:28px;width:min(90vw,380px);box-sizing:border-box}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;font:inherit;margin-top:12px}input{background:#0b1120;border:1px solid #64748b;color:white}button{background:#2563eb;color:white;border:0;font-weight:bold}small{color:#94a3b8}#error{color:#fda4af}</style></head><body><main><h2>◈ GMGN Trader</h2><p>Entre para acompanhar sua simulação fictícia.</p><form id="login"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button>Entrar</button></form><p id="error" role="alert"></p><small>Somente operações com dinheiro fictício.</small></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok)location.href='/';else document.getElementById('error').textContent='Senha incorreta ou acesso temporariamente indisponível';});</script></body></html>
